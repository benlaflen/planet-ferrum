[item-description]
ferrum-clay=Ionic clay leaching is one of the most common starting points for rare earth metals.
ferrum-concentrated-clay=Raw clay has its rare earth concentration drastically increased through a combination of crushing, grinding, and electromagnetic separation.
ferrum-rare-earth-oxide=Solutions of rare earths are separated out into individual elements over hundreds of settling stages to produce useful high-purity oxides.
ferrum-rare-earth-magnet=Finally, we can alloy the rare earth oxides to fabricate a powerful natural magnet suitable for a variety of consumer applications.
ferrum-robotics-science-pack=Used by labs for research.
ferrum-fabricator=An experimental assembler with built-in roboport that can exploit its docked robots to enhance its own capabilities.
ferrum-infuser=An experimental high-pressure impregnation chamber that rapidly reacts liquids with solid items that pass through on belts.
ferrum-overclock-robot=An experimental logistics robot that emits an EM wave across the local beacon network and temporarily augments their effects when it leaves the roboport.

[fluid-name]
ferrum-rare-earth-solution=Rare earth solution

[fluid-description]
ferrum-rare-earth-solution=Rare earth concentrate is further refined by dissolving it into solution to extract any remaining sediments and trace radioactive compounds..

