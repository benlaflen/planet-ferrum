[technology-description]
planet-discovery-ferrum=Discover the current Ferran trajectory.
ferrum-contact=Establish a connection to the Ferran surface.
ferrum-fabricator=Processing rare earths will require a high degree of adaptability and precision.
ferrum-lubricant-reclamation=Complex chemicals can be decomposed into essential building blocks.
ferrum-hydrocarbons=Ways to manipulate extract and combine basic hydrocarbons.
ferrum-rare-earth-processing=Necessary innovations for finishing our rare earth metal production.
ferrum-electrolysis=The same atmospheric ions that make Ferrum inhabitable could be a valuable source of electrolytes.
ferrum-robotics-science-pack=Although the planet is dead, there is much we can learn from Ferrum's robots.
ferrum-frontline-robotics=Robots need to survive the fires they fly into.
ferrum-overclock-robots=Experimental robots that overclock nearby beacons on launch.
ferrum-deionizing-belts=Shield belts against Ferrum's charged dust so they can be built on the surface.
ferrum-advanced-rare-earth-processing=Rare earth metal optimizations can enhance production on Ferrum and abroad.
ferrum-adaptive-chemistry=The first fabricator proves the surface can run chemistry unattended.
ferrum-infusion-chemistry=Reactions can now happen in the belt itself.

