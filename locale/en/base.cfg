[recipe-description]
ferrum-lubricant-pyrolysis=Pyrolysis allows complex hydrocarbons like lubricant to be broken down into their constituent elements.
ferrum-coal-agglomeration=We can bind basic carbon atoms back into more complex compounds.
ferrum-rare-earth-separation=Cycles the solution, picking out a little of whatever it was carrying.
ferrum-solvent-extraction=Wastefully gathers the majority of the clay's rare earth content in one cycle.
ferrum-lubricant-reclamation=Separates lubricant into its composite acid and oil.
ferrum-atmospheric-condensation=Wrings water and dissolved salts out of Ferrum's dead air.
ferrum-holmium-separation=Holmium is a rare earth like any other once you have it in solution.
ferrum-rare-earth-micronutrients=While rare earths are toxic to life in concentration, in a pinch a small amount can stimulate plant growth.
ferrum-copper-cementation=Iron gives up its solid form in solution as copper coats it, seemingly transmuting the plates.
ferrum-crude-agglomeration=Binding carbon without a catalyst wastes most of the acid.
ferrum-crude-molten-iron=Burning fuel to melt plates works, at a price.
ferrum-molten-iron=Heavy oil carries the heat, and leaves a little carbon behind.

