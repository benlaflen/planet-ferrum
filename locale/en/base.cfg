[entity-description]
ferrum-roboport=Contacted from orbit and beyond repair or removal. It is wired directly into the planet's internal electric grid.
ferrum-frame-ore=A burst internal artery of robot frames that have piled up dense enough to mine.
ferrum-gear-ore=A burst internal artery of iron gears that have piled up dense enough to mine.
ferrum-clay-ore=Rare-earth-rich sediment that has rusted onto the surface of the planet from its atmospheric ions over eons.
ferrum-lubricant=A ruptured internal artery of lubricant that is now leaking onto the Ferran surface.

